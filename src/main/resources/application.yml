# declare global variable
SERVER_PORT: 8080

# port of smtp protocol
EMAIL_HOST: smtp.gmail.com
EMAIL_PORT: 587
EMAIL_ID: ${EMAIL_ID}
EMAIL_PASSWORD: ${EMAIL_PASSWORD}
VERIFY_EMAIL_HOST: ${APP_URL}

server:
  port: ${PORT:8080}

ocr:
  tesseract:
    datapath: /usr/share/tesseract-ocr/4.00/tessdata
    language: "eng+vie"

spring:
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: true
    always-use-message-format: true

  thymeleaf:
    mode: HTML
    suffix: .html
    prefix: classpath:/templates/
    cache: false

  main:
    allow-circular-references: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB
      location: ${java.io.tmpdir}
    session:
      timeout: 6h

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 0
      connection-test-query: SELECT 1
      keepalive-time: 60000
      minimum-idle: 1
      maximum-pool-size: 5
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: true

  mail:
    host: ${EMAIL_HOST}
    port: ${EMAIL_PORT}
    username: ${EMAIL_ID}
    password: ${EMAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        mime:
          charset: UTF-8
        smtp:
          writetimeout: 10000
          connectiontimeout: 10000
          timeout: 10000
          auth: true
          starttls:
            enable: true
            required: true
    verify:
      host: ${VERIFY_EMAIL_HOST}

main:
  allow-bean-definition-overriding: true

paypal:
  client:
    id: ${PAYPAL_CLIENT_ID}
    secret: ${PAYPAL_CLIENT_SECRET}
  mode: sandbox
  return-url: ${APP_URL}/user/checkout/paypal/success
  cancel-url: ${APP_URL}/user/checkout/paypal/cancel

jwt:
  signedKey: ${JWT_SIGNED_KEY}

currency:
  api:
    url: "https://v6.exchangerate-api.com/v6/${EXCHANGE_RATE_API_KEY}/latest/VND"

gemini:
  api:
    key: ${GEMINI_API_KEY}
    url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL}

betterstack:
  source-token: ${BETTERSTACK_SOURCE_TOKEN}
  dashboard-url: ${BETTERSTACK_DASHBOARD_URL}

payos:
  client-id: ${PAYOS_CLIENT_ID:placeholder}
  api-key: ${PAYOS_API_KEY:placeholder}
  checksum-key: ${PAYOS_CHECKSUM_KEY:placeholder}
 
sepay:
  api-key: ${SEPAY_API_KEY}
  bank-account-number: ${SEPAY_BANK_ACCOUNT}
  bank-brand: ${SEPAY_BANK_BRAND}

vietqr:
  bank-id: ${VIETQR_BANK_ID}
  account-no: ${VIETQR_ACCOUNT_NO}
  account-name: ${VIETQR_ACCOUNT_NAME}
